<!-- Plantilla de firma HTML. create_draft y send_email la añaden al final del correo: en texto plano
     siempre (aplanada), y en HTML cuando pides html. Se desactiva con with_signature: false.
     Gmail solo respeta estilos inline: nada de <style> ni clases.
     Para la tuya de verdad: copia este fichero a style/firma.local.html y edita ahi.
     El .local tiene prioridad y no se versiona. -->
<table cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#202124;border-collapse:collapse;">
  <tr>
    <td style="padding:12px 0 0 0;border-top:2px solid #1a73e8;">
      <div style="font-weight:bold;font-size:14px;color:#202124;">Nombre Apellido</div>
      <div style="color:#5f6368;padding-top:2px;">
        <a href="mailto:tu.correo@ejemplo.com" style="color:#1a73e8;text-decoration:none;">tu.correo@ejemplo.com</a>
        &nbsp;·&nbsp;
        <span>600 000 000</span>
      </div>
    </td>
  </tr>
</table>
